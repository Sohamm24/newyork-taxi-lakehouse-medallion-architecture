services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    mem_limit: 512m
    profiles:
      - core
      - orchestration
      - bi

  minio-init:
    build:
      context: ./docker/minio-init
      dockerfile: Dockerfile
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKETS: bronze,silver,gold,audit
    restart: "no"
    mem_limit: 256m
    profiles:
      - core
      - orchestration

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: nyc-taxi-spark:3.5.1
    container_name: spark
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PYTHONPATH: /opt/spark/work-dir
    volumes:
      - ./scripts:/opt/spark/work-dir/scripts
      - ./spark_jobs:/opt/spark/work-dir/spark_jobs
      - ./tests:/opt/spark/work-dir/tests
      - ./data:/opt/spark/work-dir/data
      - ./docs:/opt/spark/work-dir/docs
      - ./.env:/opt/spark/work-dir/.env
    mem_limit: 2560m
    profiles:
      - core
      - orchestration

  dbt:
    build:
      context: ./docker/dbt
      dockerfile: Dockerfile
    image: nyc-taxi-dbt:1.8.2
    container_name: dbt
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      MINIO_HOST: minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./dbt_project:/usr/app/dbt_project
      - ./scripts:/usr/app/scripts
    mem_limit: 512m
    profiles:
      - core
      - orchestration

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    profiles:
      - orchestration
      - bi

  airflow:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: nyc-taxi-airflow:2.9.2
    container_name: airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
      spark:
        condition: service_started
      dbt:
        condition: service_started
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1536m
    profiles:
      - orchestration

  metabase:
    image: metabase/metabase:v0.49.13
    container_name: metabase
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    profiles:
      - bi

volumes:
  minio_data:
  postgres_data:
  metabase_data:
